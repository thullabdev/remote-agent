<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="t">How Remote Agent works</title>
  <desc id="d">Claude Code Sessions talk to the Bridge over a Unix socket through the Remote Agent mod. The Bridge serves the web chat on 127.0.0.1:8787, published over HTTPS with tailscale serve, and can talk to Telegram. The Bridge also starts Spawned Sessions in tmux.</desc>
