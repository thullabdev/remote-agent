    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0aa7ff"/>
      <stop offset="0.55" stop-color="#3b6cff"/>
      <stop offset="1" stop-color="#7a3ffc"/>
    </linearGradient>
    <linearGradient id="flowL" gradientUnits="userSpaceOnUse" x1="318" y1="0" x2="442" y2="0">
      <stop offset="0" stop-color="#0aa7ff"/>
      <stop offset="1" stop-color="#3b6cff"/>
    </linearGradient>
    <linearGradient id="flowR" gradientUnits="userSpaceOnUse" x1="758" y1="0" x2="882" y2="0">
      <stop offset="0" stop-color="#3b6cff"/>
      <stop offset="1" stop-color="#9b51fc"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#14226b" flood-opacity="0.10"/></filter>
